<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Movie Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <ul class="gallery">
      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
          alt="Mountain landscape"
        />
      </li>

      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
          alt="Tropical beach"
        />
      </li>

      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
          alt="Mountains"
        />
      </li>

      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
          alt="Lake and mountains"
        />
      </li>

      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
          alt="Road through nature"
        />
      </li>

      <li class="gallery-item">
        <img
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
          alt="Forest"
        />
      </li>
    </ul>
    <ul class="dashboard">
      <li class="panel panel-small">Statistics</li>
      <li class="panel panel-main">Analytics</li>
      <li class="panel panel-large">Activity</li>
    </ul>
    <ul class="profiles">
      <li class="profile">
        <h2>Alex</h2>
        <p class="description">
          Front-end developer who enjoys creating websites.
        </p>
        <a class="profile-link" href="#">View profile</a>
      </li>

      <li class="profile">
        <h2>Emma</h2>
        <p class="description">
          Designer and photographer who creates digital products, takes photos
          and works with different visual projects.
        </p>
        <a class="profile-link" href="#">View profile</a>
      </li>
    </ul>
  </body>
</html>
